services:
  backend:
    build: .
    command: python -m backend.main
    networks:
      - studyplan
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./storage/studyplan.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: ./storage/uploads
      MAX_UPLOAD_SIZE_MB: "20"
      TIMEZONE: Europe/Berlin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    volumes:
      - .:/app
      - studyplan_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    networks:
      - studyplan
    ports:
      - "8501:8501"
    environment:
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/app

networks:
  studyplan:
    driver: bridge

volumes:
  studyplan_data:
